<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>AI Office</title>
<style>
  /* Цвета те же, что у офиса (src/web/styles/tokens.css): окно ожидания —
     это первый экран приложения, и он не должен выглядеть чужим. */
  :root {
    color-scheme: light dark;
    --canvas: #f1f1f1; --ink: #141414; --ink-3: #6e6e6e;
    --film: rgba(0,0,0,.06); --accent: #2f7bf6; --danger: #dc4b3f;
  }
  @media (prefers-color-scheme: dark) {
    :root { --canvas: #0d0e11; --ink: #f4f4f5; --ink-3: #a1a1a1; --film: rgba(255,255,255,.08); }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; gap: 16px;
    flex-direction: column; align-items: center; justify-content: center;
    background: var(--canvas); color: var(--ink);
    font: 13px/1.45 -apple-system, 'Segoe UI', Roboto, sans-serif;
    user-select: none; -webkit-user-select: none;
  }
  img { width: 72px; height: 72px; }
  h1 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: .2px; }
  #status { color: var(--ink-3); min-height: 18px; text-align: center; padding: 0 28px; }
  #status.failed { color: var(--danger); }
  #bar { width: 320px; height: 4px; border-radius: 999px; background: var(--film); overflow: hidden; visibility: hidden; }
  #bar > div { height: 100%; width: 0; background: var(--accent); transition: width .2s ease; }
  /* npm не сообщает размер архива, и доли загрузки у нас нет. Честнее ползунок
     «идёт», чем шкала, застрявшая на нуле. */
  #bar.unknown > div { width: 30%; animation: slide 1.4s ease-in-out infinite; }
  @keyframes slide { 0% { margin-left: -30%; } 100% { margin-left: 100%; } }
  .row { display: flex; gap: 8px; }
  button {
    height: 32px; padding: 0 14px; border-radius: 999px; border: 0; cursor: pointer;
    font: inherit; font-weight: 500; background: var(--film); color: var(--ink);
  }
  button.primary { background: var(--accent); color: #fff; }
  a { color: var(--ink-3); font-size: 11px; cursor: pointer; }
  /* Экран ошибки запуска: причина, папка журналов и что делать дальше.
     Текст можно выделить и скопировать — его и пришлют в поддержку. */
  #fail { display: none; flex-direction: column; align-items: center; gap: 10px; padding: 0 28px; text-align: center; }
  #fail h2 { margin: 0; font-size: 15px; font-weight: 600; color: var(--danger); }
  #fail pre {
    margin: 0; max-width: 100%; max-height: 120px; overflow: auto; padding: 8px 10px; border-radius: 8px;
    background: var(--film); text-align: left; white-space: pre-wrap; word-break: break-word;
    font: 11px/1.4 ui-monospace, Consolas, monospace; user-select: text; -webkit-user-select: text;
  }
  #fail p { margin: 0; color: var(--ink-3); }
  #fail code { font: 11px ui-monospace, Consolas, monospace; user-select: text; -webkit-user-select: text; word-break: break-all; }
  body.failed > img { width: 48px; height: 48px; }
  body.failed > h1, body.failed > #status, body.failed > #bar, body.failed > #log { display: none; }
</style>
</head>
<body>
  <img src="build/icon.png" alt="">
  <h1>AI Office</h1>
  <div id="status">Открываю офис…</div>
  <div id="bar"><div></div></div>

  <div id="fail">
    <h2 id="fail-title"></h2>
    <pre id="fail-reason"></pre>
    <p id="fail-hint"></p>
    <code id="fail-logs"></code>
    <div class="row">
      <button class="primary" id="fail-open"></button>
      <button id="fail-retry"></button>
      <button id="fail-quit"></button>
    </div>
  </div>

  <a id="log">Журнал сервера</a>

<script>
  const status = document.getElementById('status');
  const bar = document.getElementById('bar');
  const fill = bar.firstElementChild;

  window.officeBoot.onStatus(({ text, progress, failed }) => {
    status.textContent = text;
    status.classList.toggle('failed', Boolean(failed));
    if (typeof progress === 'number') {
      bar.style.visibility = 'visible';
      bar.classList.toggle('unknown', progress <= 0);
      if (progress > 0) fill.style.width = `${Math.round(progress * 100)}%`;
    }
  });

  document.getElementById('log').onclick = () => window.officeBoot.openLog();

  // Запуск сорвался: окно ожидания становится экраном ошибки. Тексты
  // приходят из main уже на нужном языке (desktop/i18n.js).
  window.officeBoot.onFailure(({ title, reason, hint, logs, open, retry, quit }) => {
    document.body.classList.add('failed');
    document.getElementById('fail').style.display = 'flex';
    document.getElementById('fail-title').textContent = title;
    document.getElementById('fail-reason').textContent = reason;
    document.getElementById('fail-hint').textContent = hint;
    document.getElementById('fail-logs').textContent = logs;
    const button = (id, text, action) => {
      const el = document.getElementById(id);
      el.textContent = text;
      el.onclick = () => window.officeBoot.failureAction(action);
    };
    button('fail-open', open, 'logs');
    button('fail-retry', retry, 'retry');
    button('fail-quit', quit, 'quit');
  });
</script>
</body>
</html>
