<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>AI Office</title>
<style>
  /* Цвета те же, что у офиса (src/web/styles/tokens.css): окно ожидания —
     это первый экран приложения, и он не должен выглядеть чужим. */
  :root {
    color-scheme: light dark;
    --canvas: #f1f1f1; --ink: #141414; --ink-3: #6e6e6e;
    --film: rgba(0,0,0,.06); --accent: #2f7bf6; --danger: #dc4b3f;
  }
  @media (prefers-color-scheme: dark) {
    :root { --canvas: #0d0e11; --ink: #f4f4f5; --ink-3: #a1a1a1; --film: rgba(255,255,255,.08); }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; gap: 16px;
    flex-direction: column; align-items: center; justify-content: center;
    background: var(--canvas); color: var(--ink);
    font: 13px/1.45 -apple-system, 'Segoe UI', Roboto, sans-serif;
    user-select: none; -webkit-user-select: none;
  }
  img { width: 72px; height: 72px; }
  h1 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: .2px; }
  #status { color: var(--ink-3); min-height: 18px; text-align: center; padding: 0 28px; }
  #status.failed { color: var(--danger); }
  #bar { width: 320px; height: 4px; border-radius: 999px; background: var(--film); overflow: hidden; visibility: hidden; }
  #bar > div { height: 100%; width: 0; background: var(--accent); transition: width .2s ease; }
  /* npm не сообщает размер архива, и доли загрузки у нас нет. Честнее ползунок
     «идёт», чем шкала, застрявшая на нуле. */
  #bar.unknown > div { width: 30%; animation: slide 1.4s ease-in-out infinite; }
  @keyframes slide { 0% { margin-left: -30%; } 100% { margin-left: 100%; } }
  #ask { display: none; flex-direction: column; align-items: center; gap: 12px; padding: 0 32px; text-align: center; }
  #ask p { margin: 0; color: var(--ink-3); }
  .row { display: flex; gap: 8px; }
  button {
    height: 32px; padding: 0 14px; border-radius: 999px; border: 0; cursor: pointer;
    font: inherit; font-weight: 500; background: var(--film); color: var(--ink);
  }
  button.primary { background: var(--accent); color: #fff; }
  a { color: var(--ink-3); font-size: 11px; cursor: pointer; }
</style>
</head>
<body>
  <img src="build/icon.png" alt="">
  <h1>AI Office</h1>
  <div id="status">Открываю офис…</div>
  <div id="bar"><div></div></div>

  <div id="ask">
    <p>Чтобы команда могла работать, нужен движок Claude Code — около 310&nbsp;МБ.
       Он скачивается из npm один раз.</p>
    <div class="row">
      <button class="primary" id="install">Скачать движок</button>
      <button id="skip">Потом</button>
    </div>
  </div>

  <a id="log">Журнал сервера</a>

<script>
  const status = document.getElementById('status');
  const bar = document.getElementById('bar');
  const fill = bar.firstElementChild;
  const ask = document.getElementById('ask');

  window.officeBoot.onStatus(({ text, progress, failed }) => {
    status.textContent = text;
    status.classList.toggle('failed', Boolean(failed));
    if (typeof progress === 'number') {
      bar.style.visibility = 'visible';
      bar.classList.toggle('unknown', progress <= 0);
      if (progress > 0) fill.style.width = `${Math.round(progress * 100)}%`;
    }
  });

  window.officeBoot.onNeedEngine(() => {
    status.textContent = 'Движок агентов не найден';
    ask.style.display = 'flex';
  });

  const choose = (value) => { ask.style.display = 'none'; window.officeBoot.choose(value); };
  document.getElementById('install').onclick = () => choose('install');
  document.getElementById('skip').onclick = () => choose('skip');
  document.getElementById('log').onclick = () => window.officeBoot.openLog();
</script>
</body>
</html>
