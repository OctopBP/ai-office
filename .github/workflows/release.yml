# Установщики приложения: по тегу `v*` собираются .dmg и .zip для macOS и .exe
# для Windows вместе с файлами автообновления (latest*.yml, .blockmap) и
# складываются в черновик релиза. Черновик публикуется заключительным шагом,
# только когда собрались все платформы и в релизе лежат все установщики и
# latest*.yml. Упала хоть одна платформа — релиз остаётся черновиком с тем, что
# успело собраться: обновляторы не увидят выпуск, в котором нет их файла.
# Описание релиза открывается разделом «Что нового» — заметками выпуска из
# аннотации тега, которую ставит офис (scripts/release-notes.mjs).
#
# Движки провайдеров внутрь установщиков не кладутся: их ставят с экрана
# «Провайдеры» при первом запуске (docs/design/providers/spec.md).
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
          - os: windows-latest
            target: win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Сцена и текстуры лежат в LFS: без них веб соберётся с файлами-
          # указателями вместо моделей, и офис приедет пустой комнатой.
          lfs: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Windows-сборка качает MinGit (scripts/fetch-mingit.mjs) по прямой
      # ссылке; токен нужен запасному пути через API (--latest), чтобы не
      # упираться в анонимный лимит на общем IP раннера.
      - name: ресурсы приложения
        run: npm run build:desktop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: зависимости оболочки
        run: npm ci
        working-directory: desktop
      # Ключ нотаризации Apple приходит секретом, а electron-builder ждёт путь
      # к файлу — поэтому кладём его на диск. Нет секрета — шага как не было,
      # и сборка пойдёт дальше без нотаризации.
      - name: ключ нотаризации
        if: matrix.target == 'mac'
        env:
          KEY: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -n "$KEY" ]; then
            mkdir -p ~/private_keys
            printf '%s' "$KEY" > ~/private_keys/AuthKey.p8
            echo "APPLE_API_KEY=$HOME/private_keys/AuthKey.p8" >> "$GITHUB_ENV"
            echo "ключ нотаризации положен"
          else
            echo "секрета APPLE_API_KEY_P8 нет — нотаризации не будет"
          fi

      # Сертификат Developer ID кладём во временную связку ключей сами и
      # отдаём сборщику только имя (CSC_NAME), а не сам файл (CSC_LINK).
      # electron-builder 26.15 со своей связкой не справляется: в
      # set-key-partition-list он подставляет пароль .p12 вместо пароля
      # связки и падает с «passphrase is not correct» при верном пароле.
      # Заодно сертификат Apple не попадает в Windows-сборку: там
      # electron-builder принял бы CSC_LINK за свой и подписывал бы им .exe.
      - name: сертификат подписи
        if: matrix.target == 'mac'
        env:
          CERT: ${{ secrets.CSC_LINK }}
          CERT_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          if [ -z "$CERT" ]; then
            echo "секрета CSC_LINK нет — сборка будет подписана «для себя»"
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          name="$(security find-identity -v -p codesigning "$keychain" \
            | sed -n 's/.*"Developer ID Application: \(.*\)"$/\1/p' | head -1)"
          if [ -z "$name" ]; then
            echo "в .p12 нет сертификата Developer ID Application"
            security find-identity -v -p codesigning "$keychain"
            exit 1
          fi
          echo "CSC_NAME=$name" >> "$GITHUB_ENV"
          echo "сертификат положен: $name"

      - name: установщик
        run: npm run dist:${{ matrix.target }} -- --publish never
        working-directory: desktop
        # Подпись и нотаризация включаются наличием переменных: конфиг сборки
        # смотрит ровно на них (desktop/builder.config.js). CSC_NAME кладёт
        # шаг выше; секретов нет — переменные пустые, и сборка выходит
        # подписанной «для себя», как и первые версии.
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # spawn-helper терминала (node-pty) должен быть переподписан сборщиком и
      # исполняем в обеих .app — до выкладки, а не после жалобы нотаризации.
      # Признак подписи сертификатом — тот же CSC_NAME, что положил шаг выше.
      - name: подпись нативного модуля
        if: matrix.target == 'mac'
        run: node scripts/pack-native.mjs --verify-app desktop/out
      - uses: actions/upload-artifact@v7
        with:
          name: ai-office-${{ matrix.target }}
          # zip, latest*.yml и .blockmap — для автообновления: без них
          # electron-updater не найдёт новую версию в релизе.
          path: |
            desktop/out/*.dmg
            desktop/out/*.zip
            desktop/out/*.exe
            desktop/out/*.blockmap
            desktop/out/latest*.yml
            desktop/out/beta*.yml
            desktop/out/alpha*.yml
          if-no-files-found: error

  release:
    needs: build
    # Не только при успехе сборки: упавшая платформа не должна терять собранное
    # остальными — оно ляжет в черновик, публикацию же решает последний шаг.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Канал выпуска — по суффиксу тега (docs/design/release-channels/spec.md
      # §6): v1.2.3 — стабильный latest, v1.2.3-beta.N / v1.2.3-alpha.N —
      # пререлиз своего канала. Пререлиз публикуется с флагом prerelease и не
      # становится latest: иначе страница «последний релиз» и стабильные
      # обновляторы увидели бы тестовую сборку.
      - name: канал выпуска
        id: channel
        run: |
          case "$GITHUB_REF_NAME" in
            *-*)
              channel="$(sed -n 's/^v[^-]*-\([a-z]*\).*/\1/p' <<< "$GITHUB_REF_NAME")"
              echo "channel=${channel:-beta}" >> "$GITHUB_OUTPUT"
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
              echo "пререлиз, канал ${channel:-beta}"
              ;;
            *)
              echo "channel=latest" >> "$GITHUB_OUTPUT"
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
              echo "стабильный выпуск, канал latest"
              ;;
          esac
      # Полная история нужна запасному списку «Что нового» — коммиты с
      # прошлого тега.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # checkout кладёт тег без его объекта-аннотации, а заметки выпуска
      # офис пишет именно в аннотацию, — поэтому тег забираем ещё раз явно.
      - name: аннотация тега
        run: git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
      # «Что нового» — из заметок выпуска в аннотации тега; тег поставлен
      # руками — из коммитов с прошлого тега (scripts/release-notes.mjs).
      # Ниже — постоянные разделы. Автоматические заметки GitHub не
      # включаем: они дублировали бы «Что нового» списком пулл-реквестов.
      - name: описание релиза
        run: |
          node scripts/release-notes.mjs "$GITHUB_REF_NAME" > "$RUNNER_TEMP/body.md"
          cat >> "$RUNNER_TEMP/body.md" <<'EOF'
          ## Что скачивать

          | Система | Файл |
          |---|---|
          | macOS, Apple Silicon (M1 и новее) | `AI-Office-<версия>-arm64.dmg` |
          | macOS, Intel | `AI-Office-<версия>-x64.dmg` |
          | Windows 10/11, x64 | `AI-Office-Setup-<версия>.exe` |

          Файлы `.zip`, `.blockmap` и `latest*.yml` — для автообновления,
          скачивать их руками не нужно.

          ## Первый запуск

          macOS: приложение подписано и заверено Apple — открывается
          двойным щелчком, как любое другое.
          Windows: сертификата для Windows нет, поэтому SmartScreen
          спросит — «Подробнее» → «Выполнить в любом случае».

          Агентам нужен хотя бы один провайдер. Его ставят и подключают
          на экране «Провайдеры» при первом запуске: «Установить», затем
          ключ API или вход. Поддерживаются Claude Code и Codex, новые
          провайдеры добавятся туда же.

          Подробности — [docs/guide/desktop.md](https://github.com/OctopBP/ai-office/blob/main/docs/guide/desktop.md).
          EOF
          cat "$RUNNER_TEMP/body.md"
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: ${{ steps.channel.outputs.prerelease }}
          make_latest: ${{ steps.channel.outputs.prerelease == 'true' && 'false' || 'true' }}
          files: out/*
          body_path: ${{ runner.temp }}/body.md
      # Снять черновик — только когда все платформы собрались и все файлы уже
      # в релизе. Список сверяется с самим релизом, а не с папкой out: так
      # видно и недогруженный файл. Без файлов автообновления своего канала
      # (latest*.yml у стабильного, beta*.yml / alpha*.yml у пререлиза)
      # опубликованный релиз сломал бы автообновление, поэтому их нет — релиз
      # остаётся черновиком, а шаг падает с перечнем недостающего.
      - name: публикация релиза
        if: ${{ needs.build.result == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ steps.channel.outputs.channel }}
          PRERELEASE: ${{ steps.channel.outputs.prerelease }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          assets="$(gh release view "$GITHUB_REF_NAME" --json assets -q '.assets[].name')"
          echo "в релизе:"; echo "$assets"
          missing=""
          for file in \
            "$CHANNEL.yml" "$CHANNEL-mac.yml" \
            "AI-Office-Setup-$version.exe" \
            "AI-Office-$version-arm64.dmg" "AI-Office-$version-x64.dmg" \
            "AI-Office-$version-arm64.zip" "AI-Office-$version-x64.zip"; do
            grep -qxF "$file" <<< "$assets" || missing="$missing $file"
          done
          if [ -n "$missing" ]; then
            echo "в релизе нет:$missing — оставляю черновиком"
            exit 1
          fi
          if [ "$PRERELEASE" = "true" ]; then
            gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease --latest=false
            echo "пререлиз $GITHUB_REF_NAME опубликован (канал $CHANNEL, не latest)"
          else
            gh release edit "$GITHUB_REF_NAME" --draft=false --latest
            echo "релиз $GITHUB_REF_NAME опубликован"
          fi
