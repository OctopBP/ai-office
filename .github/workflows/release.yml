# Установщики приложения: по тегу `v*` собираются .dmg для macOS и .exe для
# Windows и складываются в черновик релиза. Черновик, а не готовый релиз, —
# сборку надо проверить руками на обеих системах, прежде чем её кто-то скачает.
#
# Движок Claude Code внутрь установщиков не кладётся: он проприетарный, и
# приложение ставит его само при первом запуске (docs/design/desktop-app/spec.md §3).
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
          - os: windows-latest
            target: win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Сцена и текстуры лежат в LFS: без них веб соберётся с файлами-
          # указателями вместо моделей, и офис приедет пустой комнатой.
          lfs: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: ресурсы приложения
        run: npm run build:desktop
      - name: зависимости оболочки
        run: npm ci
        working-directory: desktop
      - name: установщик
        run: npm run dist:${{ matrix.target }} -- --publish never
        working-directory: desktop
        # Подписи пока нет: сборка выходит неподписанной, и первый запуск
        # требует «Открыть всё равно». Подпись и нотаризация — фаза 3 спеки,
        # там же включатся секреты (docs/design/desktop-app/spec.md §8).
      - uses: actions/upload-artifact@v7
        with:
          name: ai-office-${{ matrix.target }}
          path: |
            desktop/out/*.dmg
            desktop/out/*.exe
          if-no-files-found: error

  draft:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: out/*
          body: |
            ## Что скачивать

            | Система | Файл |
            |---|---|
            | macOS, Apple Silicon (M1 и новее) | `AI Office-<версия>-arm64.dmg` |
            | macOS, Intel | `AI Office-<версия>.dmg` |
            | Windows 10/11, x64 | `AI Office Setup <версия>.exe` |

            ## Первый запуск

            Сборка не подписана, поэтому система спросит. macOS: правый щелчок
            по приложению → «Открыть» → «Открыть». Windows: «Подробнее» →
            «Выполнить в любом случае».

            Движок Claude Code (~310 МБ) в установщик не вшит — приложение
            найдёт уже поставленный или скачает сам при первом запуске.
            Нужен доступ к модели: подписка Claude (`claude` → `/login`) или
            `ANTHROPIC_API_KEY`.

            Подробности — [docs/guide/desktop.md](https://github.com/OctopBP/ai-office/blob/main/docs/guide/desktop.md).
