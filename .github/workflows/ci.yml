name: ci
on:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: premerge diag
        run: npm run -s test:premerge 2>&1 | grep -E 'DIAG|❌|прошли' || true
      - name: offices x25
        run: |
          for i in $(seq 1 25); do
            echo "=== run $i"
            npm run -s test:offices 2>&1 | grep -E 'DIAG|❌' || true
          done
