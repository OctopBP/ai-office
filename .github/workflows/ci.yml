# Проверки на каждый PR и на каждый коммит в main: типы, сборка веба и все
# наборы, которые не ходят в сеть и не тратят токены. Регрессионные тесты
# менеджера (npm run test:pm) здесь не гоняются — они стоят токенов и живут
# на машине разработчика.
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # 3D-модели и текстуры лежат в LFS, а vite импортирует их из design/:
          # без содержимого сборка получит файлы-указатели вместо моделей.
          lfs: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: тесты без сети и токенов
        # Список берётся из package.json, а не ведётся руками: новый набор
        # попадает в CI сам. Исключение одно — test:pm, он ходит в модель.
        run: |
          for t in $(node -p "Object.keys(require('./package.json').scripts).filter((k) => k.startsWith('test:') && k !== 'test:pm').join(' ')"); do
            echo "::group::$t"
            npm run -s "$t"
            echo "::endgroup::"
          done
